name: CI

# Runs on every push (and PRs from forks) — see the DX section of the README.
# JS-level verification only. Native app builds are deliberately NOT here:
# they are slow and need signing credentials (see native-build.yml).
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both versions come from package.json — setup-bun reads `packageManager`
      # (falling back to `engines.bun`), setup-node reads `engines.node`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier (format check)
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: TypeScript (strict typecheck)
        run: bun run typecheck

      - name: TypeScript (mobile app)
        run: bun run typecheck:mobile

      - name: Knip (unused files/exports/dependencies)
        run: bun run knip

      - name: Tests (unit + API integration + app logic, in-memory DB)
        run: bun test

      - name: Production build
        run: bun run build
