# Settings flow: switch design variant (A/B/office/kids) + theme + language
# and verify the design-system entry stays reachable.
# Run with: maestro test apps/mobile/e2e/settings-theme-design.yaml
appId: com.example.mobileboilerplate.dev
---
- launchApp
- runFlow:
    when:
      visible:
        id: 'boot.ad.skip'
    commands:
      - tapOn:
          id: 'boot.ad.skip'
- extendedWaitUntil:
    visible:
      id: 'todos.screen'
    timeout: 15000

- tapOn:
    id: 'tabs.settings'
- assertVisible:
    id: 'settings.screen'

# Design B (high visibility), dark theme, Korean
- tapOn:
    id: 'settings.design.b'
- tapOn:
    id: 'settings.theme.dark'
- tapOn:
    id: 'settings.locale.ko'
- assertVisible:
    text: '설정'

# Web-ported skins: office (light) and kids (beta), then check the gallery
# entry is still reachable with office's compact controls.
- tapOn:
    id: 'settings.theme.light'
- tapOn:
    id: 'settings.design.office'
- assertVisible:
    id: 'settings.design-system-link'
- tapOn:
    id: 'settings.design.kids'
- assertVisible:
    id: 'settings.design-system-link'

# Back to defaults
- tapOn:
    id: 'settings.locale.system'
- tapOn:
    id: 'settings.theme.system'
- tapOn:
    id: 'settings.design.a'
