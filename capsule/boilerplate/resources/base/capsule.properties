# Capsule configuration.
#
# `remote.apiBaseUrl` is public. `secret.voiceToken` is NOT — set it in the
# Bixby Developer Console (Capsule > Secrets), never here, and never commit a
# real value. This file only documents the keys ../../code/voiceApi.js reads.
#
# It is also a placeholder for the real answer: OAuth2 account linking, so each
# Bixby user acts as themselves instead of everyone sharing one token. See
# docs/voice-assistant.md.
remote.apiBaseUrl=https://api.example.com
